<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Same key and values as rbmrs.dev, so the site toggle drives the game too.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
        if (new URLSearchParams(location.search).has("embed")) {
          document.documentElement.classList.add("embed");
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="https://rbmrs.dev/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Newsreader:wght@600&display=swap"
    />
    <title>Type Master — Rafael Moraes</title>
    <style>
      /* Force perfect centering of words with moderate rightward adjustment */
      .words-wrapper {
        position: fixed !important;
        top: 25% !important;
        left: 50% !important;
        transform: translateX(-50%) translateX(50px) !important;
        width: auto !important;
        display: flex !important;
        gap: 30px !important;
        z-index: 5 !important;
      }

      /* Position history container relative to the centered words */
      .word-history-container {
        position: fixed !important;
        top: 25% !important;
        right: 50% !important;
        margin-right: 55px !important;
        display: flex !important;
        flex-direction: row !important;
        justify-content: flex-end !important;
        gap: 30px !important;
        z-index: 4 !important;
        width: 400px !important;
        opacity: 0.7 !important;
      }

      /* Ensure history items are visible */
      .word.history-item {
        color: var(--muted) !important;
        opacity: 0.8 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
