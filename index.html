<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Same key and values as rbmrs.dev, so the site toggle drives the game too.
      // A pick lives in sessionStorage for the browser session. Without one,
      // the CSS follows the system theme.
      (function () {
        try {
          localStorage.removeItem("theme");
        } catch (e) {}
        try {
          var stored = sessionStorage.getItem("theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {}
        if (new URLSearchParams(location.search).has("embed")) {
          document.documentElement.classList.add("embed");
        }
        // Phones and tablets: no hover and a coarse primary pointer. A narrow
        // desktop window keeps the desktop layout. Read by App.jsx and index.css.
        if (window.matchMedia && matchMedia("(hover: none) and (pointer: coarse)").matches) {
          document.documentElement.classList.add("touch");
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="https://rbmrs.dev/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Newsreader:wght@600&display=swap"
    />
    <title>Type Master — Rafael Moraes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Cloudflare Web Analytics: count only direct visits; inside the rbmrs.dev page frame, that page already counts the visit. -->
    <script>
      if (window.top === window.self) {
        var cf = document.createElement('script');
        cf.defer = true;
        cf.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        cf.setAttribute('data-cf-beacon', '{"token": "b37c30e7a0554e7390c064aa9ed43f64"}');
        document.body.appendChild(cf);
      }
    </script>
  </body>
</html>
